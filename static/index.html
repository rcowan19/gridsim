    <div class="tile"><span class="tl">Week ${S.week} games</span><span class="tv">${gs.length}</span><span class="ts">${S.n.toLocaleString()} sims each · ${S.secs}s</span></div>
    <button class="tile" data-go="games"><span class="tl">Closest game</span><span class="tv">${close ? wp(close) : '–'}</span><span class="ts">${close ? `${pct(close.sim_home_win)} ${close.home} win` : ''}</span></button>
    <button class="tile" data-go="games"><span class="tl">Biggest sim-vs-market gap</span><span class="tv">${lean && lean.spread != null ? wp(lean) : '–'}</span><span class="ts">${lean && lean.spread != null ? `${fmt(edge(lean))} pts off the line` : 'no lines yet'}</span></button>
    <button class="tile" data-go="lineup"><span class="tl">My league</span><span class="tv">${D ? (D.name || 'Connected') : 'Not connected'}</span><span class="ts">${D ? 'Open your lineup' : 'Connect to see lineup, waivers, trades'}</span></button></div>
  <div class="hgrid"><div class="card"><h3>Top projected players, week ${S.week}</h3>${top.map(r => `<button class="rowlink" data-pid="${r.id}"><span class="posb" style="color:${POSCOL[r.pos]}">${r.pos}</span><b>${r.name}</b><span class="sub2">${r.team}</span><span class="r"><b style="color:var(--text)">${fmt(P(r, 'proj'))}</b> pts <span class="sub2">(${fmt(P(r, 'lo'), 0)} to ${fmt(P(r, 'hi'), 0)})</span></span></button>`).join('')}<div class="sub2" style="margin-top:8px">Range = middle 80% of simulated outcomes. <button class="btn ghost sm" data-go="proj" style="margin-left:8px">All projections</button></div></div>
  <div class="card"><h3>Jump to</h3>${[['games', 'Games', 'All matchups, win odds and score spreads'], ['lab', 'Matchup lab', 'Run one game in depth, watch a sample game'], ['inj', 'Injuries', 'Take a player out and see what changes'], ['waivers', 'Waivers', 'Best add/drop moves for your team'], ['trades', 'Trades', 'Find fair trades that help both sides'], ['league', 'League', 'Standings and playoff odds']].map(([id, t, d]) => `<button class="rowlink" data-go="${id}"><b>${t}</b><span class="r">${d}</span></button>`).join('')}</div></div>`;
  host.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const n = NAVI.find(x => x.id === b.dataset.go); go(n.page, n.sub); });
  host.querySelectorAll('[data-pid]').forEach(b => b.onclick = () => { const r = S.rows.find(x => x.id === b.dataset.pid); if (r) showPlayer(r); });
}
/* Settings */
function renderSettings() {
  const host = $('#tab-settings'); const th = getTheme(), D = st.lg && st.lg.data, saved = localStorage.getItem('gs_league') || '1781890288';
  const segH = (id, opts, cur) => `<div class="seg" id="${id}">${opts.map(([k, l]) => `<button data-v="${k}" class="${cur === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  host.innerHTML = `<div class="setgrid">
  <div class="card"><h3>League</h3><div class="setrow"><div><b>${D ? D.name || 'Connected' : 'Not connected'}</b><div class="sd">${D ? `ID ${saved} · league week ${D.week} · scoring and roster slots read from ESPN` : `Saved ID ${saved}. ESPN must be reachable from where GridSim runs.`}</div></div></div>
    <div class="setrow"><label for="setLg">League ID</label><input class="inp" id="setLg" value="${saved}" style="max-width:180px"></div><div class="setrow"><span class="sd">Private league? Add cookies in My league, then Lineup.</span><button class="btn primary sm" id="setLoad">${D ? 'Reload league' : 'Connect league'}</button></div></div>
  <div class="card"><h3>Simulation</h3><div class="setrow"><div>Scoring<div class="sd">Applies to every projection</div></div>${segH('setFmt', Object.entries(FMTN).filter(([k]) => k !== 'custom'), st.fmt)}</div>
    <div class="setrow"><div>Sims per game<div class="sd">More sims = smoother ranges, slower runs. Standard error of a win probability near 50% is about ±1.6 pts at 1,000 sims and ±0.5 at 10,000.</div></div>${segH('setDepth', [['fast', '500'], ['std', '1,000'], ['deep', '10,000']], st.depth)}</div>
    <div class="setrow"><div>Weather and roof<div class="sd">Wind and dome adjust the game total</div></div><label class="chk"><input type="checkbox" id="setWx" ${st.useWx ? 'checked' : ''}> On</label></div></div>
  <div class="card"><h3>Appearance</h3><div class="setrow"><div>Theme</div>${segH('setTheme', [['system', 'System'], ['light', 'Light'], ['dark', 'Dark']], th)}</div>
    <div class="setrow"><div>Density<div class="sd">Compact fits more rows on screen</div></div>${segH('setDense', [['0', 'Comfortable'], ['1', 'Compact']], document.documentElement.classList.contains('dense') ? '1' : '0')}</div></div>
  <div class="card"><h3>Data</h3><div class="setrow"><div>Last updated<div class="sd">${$('#g_stamp').textContent || 'unknown'} · ${$('#dataChip').textContent}</div></div><button class="btn ghost sm" id="setUpd">Update data</button></div>
    <div class="setrow"><div>Keyboard shortcuts<div class="sd">Press ? anywhere</div></div><button class="btn ghost sm" id="setKeys">Show</button></div></div></div>`;
  const seg = (id, fn) => $('#' + id).onclick = e => { const b = e.target.closest('button'); if (b) { fn(b.dataset.v); renderSettings(); } };
  seg('setFmt', v => { setFmt(v); syncURL(); }); seg('setDepth', v => { $('#g_depth').value = v; $('#g_depth').dispatchEvent(new Event('change')); });
  seg('setTheme', v => setTheme(v)); seg('setDense', v => { document.documentElement.classList.toggle('dense', v === '1'); try { localStorage.setItem('gs_dense', v); } catch (e) {} });
  $('#setWx').onchange = e => { st.useWx = e.target.checked; reloadSlate(); };
  $('#setUpd').onclick = () => $('#g_update').click(); $('#setKeys').onclick = showHelp;
  $('#setLoad').onclick = () => { localStorage.setItem('gs_league', $('#setLg').value.trim()); go('team', 'lineup'); setTimeout(() => { const i = $('#lgId'); if (i) i.value = localStorage.getItem('gs_league'); const b = $('#lgBtn'); if (b) b.click(); }, 80); };
}

init();
</script>
