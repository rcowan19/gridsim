<html lang="en">
<head>
<meta charset="utf-8">

<title>GridSim · NFL simulator and fantasy analysis</title>

<meta name="theme-color" content="#0b0f14">
<meta property="og:title" content="GridSim">
<meta property="og:description" content="Play-by-play NFL simulator with fantasy projections and lineup advice.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0f14'/%3E%3Cpath d='M8 22V10h9a4 4 0 0 1 0 8h-5' fill='none' stroke='%235eead4' stroke-width='3'/%3E%3C/svg%3E">
<style>
/* ===== design tokens ===== */
/* Palette: warm paper and ink, with football-derived semantics
   leather = primary action, turf = positive, brick = negative, flag gold = caution */
:root{
  --bg:#f2eee4;--surface:#fbf8f1;--surface-2:#ebe5d8;--line:#d8d0bf;--line-strong:#8c8068;--line-soft:#e6dfcf;
  --text:#1d1b17;--muted:#5f584c;--dim:#6e6657;
  --accent:#8f4524;--accent-ink:#fbf8f1;--good:#2c6a3c;--bad:#a8372a;--warn:#8a5d08;
  --good-bg:rgba(44,106,60,.10);--bad-bg:rgba(168,55,42,.10);--warn-bg:rgba(138,93,8,.12);--ink-bg:rgba(29,27,23,.06);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r-sm:6px;--r-lg:10px;--pill:999px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --panel:var(--surface);--panel2:var(--surface-2);--r:var(--r-lg);
}

:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171510;--surface:#1f1c16;--surface-2:#29251d;--line:#3a352b;--line-strong:#7c725e;--line-soft:#2e2a22;
  --text:#ece6d8;--muted:#b6ad9a;--dim:#a39a86;
  --accent:#e6935f;--accent-ink:#1a1712;--good:#72c68a;--bad:#f0907f;--warn:#e3b455;
  --good-bg:rgba(114,198,138,.13);--bad-bg:rgba(240,144,127,.13);--warn-bg:rgba(227,180,85,.14);--ink-bg:rgba(236,230,216,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}



button,select,input{font:inherit;color:inherit}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card h3{margin:0 0 var(--s3);font:700 17px/1.3 var(--serif);color:var(--text);letter-spacing:0;text-transform:none}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;outline:none}
select:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{flex:1;background:none;border:0;padding:6px 0;border-radius:var(--r-sm);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line-strong)}
.btn{width:100%;border:0;border-radius:var(--r-sm);padding:11px 14px;font-weight:650;cursor:pointer;}
.btn.primary{background:var(--accent);color:var(--accent-ink);border:0}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--dim)}
.btn:disabled{opacity:.5;cursor:wait}
.sw{position:relative;width:34px;height:20px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:var(--pill);}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--line-strong);}
.sw input:checked+i{background:var(--text)}
.sw input:checked+i:after{left:17px;background:var(--surface)}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
summary{cursor:pointer;color:var(--text);font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary .dot{width:9px;height:9px;border-radius:50%}
summary small{color:var(--dim);font-weight:400;margin-left:auto}
.pl{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px}
.pl .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .ps{color:var(--dim);font-size:11px;width:22px}
.pl .sh{color:var(--dim);font-size:11px;font-family:var(--mono)}
.inj{font-style:normal;font-size:10px;font-weight:700;padding:1px 5px;border-radius:var(--r-sm);margin-left:4px;vertical-align:1px}
.inj.Q{background:var(--warn-bg);color:var(--warn)}
.inj.D,.inj.O{background:var(--bad-bg);color:var(--bad)}
.inj.B{background:var(--ink-bg);color:var(--muted)}
.pl.off .nm{color:var(--dim);text-decoration:line-through}
.note{color:var(--dim);font-size:12px;margin-top:10px}
.hide{display:none!important}
.stack{display:flex;flex-direction:column;gap:16px}
.empty{padding:70px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.sbhead{display:grid;grid-template-columns:1fr minmax(220px,1.1fr) 1fr;gap:14px;align-items:center}
.tm{display:flex;flex-direction:column;gap:2px}
.tm.r{align-items:flex-end;text-align:right}
.tm .ab{font-size:13px;font-weight:700;letter-spacing:.06em}
.tm .nm{color:var(--muted);font-size:12.5px}
.tm .win{font-size:40px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.tm .avg{color:var(--muted);font-size:12.5px}
.mid{text-align:center}
.wbar{display:flex;height:12px;border-radius:var(--pill);overflow:hidden;background:var(--line);margin:8px 0}
.wbar div{height:100%;}
.mid .line{font-size:13px;color:var(--muted)}
.mid .line b{color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
svg text{font-family:inherit}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
td.nm{font-weight:550}
td .p{color:var(--dim);font-size:11px;margin-left:6px}
td.main{font-weight:700}
.rng{display:block;margin-left:auto}
.sub2{font-size:11px;color:var(--dim);font-weight:400}
.pill{display:inline-block;padding:2px 8px;border-radius:var(--pill);background:var(--panel2);border:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.tb{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tb button{background:var(--panel2);border:1px solid var(--line);border-radius:var(--pill);padding:5px 13px;color:var(--muted);cursor:pointer;font-size:12.5px}
.tb button.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.gv{display:grid;grid-template-columns:1fr 380px;gap:16px}
@media(max-width:1200px){.gv{grid-template-columns:1fr}}
.sb{display:flex;align-items:center;justify-content:center;gap:26px;padding:6px 0 12px}
.sb .t{display:flex;align-items:baseline;gap:10px}
.sb .t b{font-size:15px;letter-spacing:.06em}
.sb .t span{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}
.sb .t.poss b:after{content:" ●";color:var(--accent);font-size:11px}
.sb .ctr{text-align:center;color:var(--muted);font-size:13px}
.sb .ctr b{display:block;color:var(--text);font-size:16px;font-family:var(--mono)}
.sit{text-align:center;color:var(--muted);margin:2px 0 8px;min-height:20px}
.sit b{color:var(--text)}
.field{width:100%;display:block;border-radius:var(--r-sm);overflow:hidden}
.ball{transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.fdl{transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:14px}
.ctrl button{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);width:40px;height:34px;cursor:pointer}
.ctrl button:hover{border-color:var(--dim)}
.ctrl button.play{width:64px;background:var(--accent);color:var(--accent-ink);border:0;font-weight:700}
.ctrl input[type=range]{flex:1;accent-color:var(--accent)}
.ctrl select{width:auto;padding:6px 8px}
.banner{margin-top:12px;padding:10px 14px;border-radius:var(--r-sm);background:var(--panel2);border:1px solid var(--line);min-height:42px;font-size:14px}
.banner.score{border-color:var(--good);background:var(--good-bg)}
.banner.to{border-color:var(--bad);background:var(--bad-bg)}
.plays{max-height:560px;overflow:auto;padding:0;scroll-behavior:smooth}
.plays .dh{position:sticky;top:0;background:var(--panel);padding:8px 14px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);z-index:1}
.pr{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:7px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:12.8px}
.pr:hover{background:var(--panel2)}
.pr.cur{background:var(--ink-bg);box-shadow:inset 3px 0 0 var(--text)}
.pr .c{color:var(--dim);font-family:var(--mono);font-size:11.5px}
.pr .d{color:var(--muted);font-size:11.5px;margin-top:1px}
.pr.sc .t{color:var(--accent);font-weight:600}
.pr.k{opacity:.55}
.pr.to .t{color:var(--bad)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--text);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.err{color:var(--bad);margin-top:10px;font-size:13px}
.tscroll{overflow-x:auto}
table.st td.nm{font-weight:550;white-space:nowrap}
th.srt{cursor:pointer;user-select:none}
th.srt:hover,th.on{color:var(--text)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--panel2)}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.posb{font-weight:700;font-size:12px}
.pos{color:var(--good)}
.neg{color:var(--bad)}
.hotc{color:var(--warn);font-weight:700}
.pill.hot{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.lnk{cursor:pointer}
.lnk:hover{color:var(--accent)}
.rtxt{display:block;text-align:right;font-size:11px;color:var(--dim);line-height:1.1}
.lgc{color:var(--dim)}
.mb td.pos,.mb td.neg{font-weight:700}
.spin.dark{margin-right:8px}
.grid2c{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
@media(max-width:1100px){.grid2c{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:1100px){.grid3{grid-template-columns:1fr}}
table.heat{border-collapse:separate;border-spacing:2px;width:auto;font-size:11px}
table.heat th{text-align:right;padding:2px 6px;border:0;white-space:nowrap;font-size:11px;text-transform:none;letter-spacing:0;font-weight:600}
table.heat th.vh{height:104px;vertical-align:bottom;padding:2px}
table.heat th.vh div{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
table.heat td{width:30px;height:26px;text-align:center;border-radius:var(--r-sm);padding:0;border:0;color:var(--text);font-size:10.5px}
.ctl{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.ctl .grow{flex:1;min-width:180px}
.ctl label.f{margin:0 0 5px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;outline:none}
.inp:focus{border-color:var(--accent)}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.fseg{width:auto}
.fseg button{padding:6px 11px;white-space:nowrap}
.tb .spacer{flex:1}
.drawer{position:fixed;inset:0;z-index:50}
.dback{position:absolute;inset:0;background:rgba(29,27,23,.35)}
.dpanel{position:absolute;right:0;top:0;bottom:0;width:min(620px,100%);background:var(--panel);border-left:1px solid var(--line);padding:22px 24px;overflow:auto;box-shadow:-8px 0 24px rgba(29,27,23,.14)}
.dx{position:absolute;right:16px;top:14px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-right:26px}
.dnm{font:700 24px/1.2 var(--serif)}
.dsub{color:var(--muted);margin-top:3px;font-size:13px}
.dbig{text-align:right}
.dbig b{display:block;font-size:40px;line-height:1;font-weight:800;color:var(--text)}
.dbig span{font-size:11px;color:var(--muted)}
.dpanel h4{margin:20px 0 8px;font:700 15px/1.3 var(--serif);color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.kpis div,.statline div{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px}
.kpis span,.statline span{display:block;font-size:11px;color:var(--muted)}
.kpis b,.statline b{font-size:16px;font-variant-numeric:tabular-nums}
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.props{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:150px 90px 1fr;gap:10px;align-items:center}
.prow label{color:var(--muted);font-size:13px}
.prow select,.prow input{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 8px;outline:none;width:100%}
.pres b{color:var(--text)}
.pres span{color:var(--dim);font-size:12px}
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:4px}
.ladder div{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;overflow:hidden}
.ladder i{position:absolute;left:0;bottom:0;height:3px;background:var(--text)}
.ladder span{font-size:11.5px;color:var(--muted);display:block}
.ladder b{font-size:15px}
.stk{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;margin-bottom:8px}
.stkh{display:flex;justify-content:space-between;margin-bottom:4px}
.stkr{display:flex;gap:7px;align-items:center;padding:3px 0;font-size:13px;cursor:pointer}
.stkr:hover{color:var(--accent)}
.stkr b{margin-left:auto}
.labside table.lab td{padding:5px 6px}
.labside td.slot{color:var(--muted);font-weight:700;font-size:12px;width:46px}
.labside select.sl{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px}
.srch{position:relative;margin-bottom:10px}
.sres{position:absolute;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);z-index:10;box-shadow:0 8px 20px rgba(29,27,23,.14);overflow:hidden}
.sres div{padding:8px 10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.sres div:hover{background:var(--panel2)}
.sres b{margin-left:auto}
.bench{margin:10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip2{background:var(--panel2);border:1px solid var(--line);border-radius:var(--pill);padding:3px 10px;font-size:12px}
.chip2 i{font-style:normal;color:var(--dim);cursor:pointer;margin-left:4px}
.chip2 i:hover{color:var(--bad)}
.lbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{width:auto;padding:7px 12px;font-size:12.5px}
.inj.O,.inj.D{background:var(--bad-bg);color:var(--bad)}
.kpi2{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px}
.kpi2 span{display:block;font-size:11.5px;color:var(--muted)}
.kpi2 b{font-size:28px;font-weight:800;display:block}
.kpi2 i{font-style:normal;color:var(--muted);font-size:12.5px}
.kpi2.hl{border-color:var(--accent)}
.kpi2.hl b{color:var(--accent)}
.alerts{margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);font-size:13px}
.mineh{color:var(--accent);font-weight:700}
tr.mineh td{background:var(--ink-bg)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.gday{grid-column:1/-1;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px;border-bottom:1px solid var(--line);padding-bottom:6px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.gtop{display:flex;justify-content:space-between;align-items:center}
.gteams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.gt.r{text-align:right}
.gat{color:var(--dim)}
.gab{font-size:13px;font-weight:800;letter-spacing:.06em}
.gnm{color:var(--muted);font-size:12px}
.gsc{font-size:34px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.gwp{color:var(--muted);font-size:13px}
table.gl td,table.gl th{padding:4px 6px;font-size:12.5px}
.gplayers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tp{display:flex;gap:6px;align-items:center;font-size:12.5px;padding:2px 0;cursor:pointer}
.tp:hover{color:var(--accent)}
.tp b{margin-left:auto}
.gfull{align-self:stretch;width:auto}
/* ===== shell ===== */
.brand{font:700 22px/1 var(--serif);letter-spacing:-.2px}
.gl{display:flex;align-items:center;gap:var(--s2);color:var(--muted);font-size:13px}
.gl select{width:auto;padding:6px var(--s3)}
.wrap{max-width:1320px;margin:0 auto;padding:var(--s5);width:100%}
.page{display:flex;flex-direction:column;gap:var(--s4)}
#tab-nfl,#tab-slate,#tab-league,.stack{display:flex;flex-direction:column;gap:var(--s4)}
.foot{max-width:1320px;margin:0 auto;padding:var(--s4) var(--s5) var(--s6);color:var(--dim);font-size:12px}
.subtabs{display:flex;gap:var(--s1);border-bottom:1px solid var(--line);margin:0;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:var(--s3) var(--s4);color:var(--muted);cursor:pointer;font-weight:600}
.subtabs button:hover{color:var(--text)}
.subtabs button.on{color:var(--text);border-bottom-color:var(--text)}
[data-sp]{display:flex;flex-direction:column;gap:var(--s4)}
[data-sp].hide{display:none}
/* ===== game lab setup ===== */
.setup{display:flex;flex-direction:column;gap:var(--s4)}
.setup-row{display:flex;align-items:flex-end;gap:var(--s4);flex-wrap:wrap}
.setup-row.hide{display:none}
.fld{min-width:190px}.fld.sm{min-width:0;width:110px}
.setup .swap{margin-bottom:0}
.actions{display:flex;gap:var(--s2);margin-left:auto}
.actions .btn{width:auto;padding:var(--s3) var(--s5)}
.adv summary{color:var(--muted);font-weight:600}
.adv[open] summary{margin-bottom:var(--s3)}
.lineups-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5)}
.lt .lth{display:flex;align-items:center;gap:var(--s2);font-weight:700;margin-bottom:var(--s2)}
.lt .lth small{margin-left:auto;color:var(--dim);font-weight:400}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.more{display:flex;align-items:center;gap:var(--s3);padding-top:var(--s3)}
.more .sub2{margin-right:auto}
.btn.sm{width:auto;padding:6px var(--s3);font-size:13px}
.empty{padding:var(--s6) var(--s5)}
.empty span,.empty small{display:block;color:var(--muted)}

.ck{display:flex;align-items:center;gap:var(--s2);font-size:13px;cursor:pointer}

.verdict.down{border-color:var(--bad);background:var(--bad-bg)}.verdict.down b{color:var(--bad)}
tr.chg td{background:var(--ink-bg)}tr.tot td{font-weight:700;border-top:1px solid var(--line-strong)}
.strong{font-weight:700}
@media(max-width:900px){.wi-grid,.cklist{grid-template-columns:1fr}}
.trf{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:flex-end;margin:var(--s3) 0}
.trf label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}.trf label.ck{flex-direction:row;align-items:center;color:var(--ink);font-size:13px}
.needs{display:grid;gap:var(--s2);margin-top:var(--s2)}.need{padding:var(--s2) var(--s3);background:var(--surface-2);border-radius:var(--r-sm)}

.thead{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);margin-bottom:var(--s3)}.thead h3{margin:0}
.pgrp{margin-top:var(--s3)}.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--s2);margin-top:4px}
.ptile{position:relative;display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:8px 10px 8px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .12s,background .12s,transform .12s}
.ptile:hover{border-color:var(--line-strong);transform:translateY(-1px)}

.ptile .tn{display:flex;flex-direction:column;min-width:0}.ptile .tn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}

.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--s2)}.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink)}
.pill:hover{border-color:var(--line-strong)}.pill.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.tdeal{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--s4);align-items:center;margin:var(--s3) 0;padding:var(--s3) var(--s4);background:var(--surface-2);border-radius:var(--r-sm)}
.tdeal div{display:flex;flex-direction:column;gap:2px}.tdeal b{font:700 16px/1.3 var(--serif)}.tdeal .arr{font-size:22px;color:var(--muted)}
.tgains{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}.gbox{display:flex;flex-direction:column;padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r-sm)}.gbox b{font:700 28px/1.2 var(--serif);font-variant-numeric:tabular-nums}
.balance{margin-top:var(--s4)}.bbar{height:10px;border-radius:6px;background:var(--accent);overflow:hidden;margin:6px 0}.bbar i{display:block;height:100%;background:#4a453c}.blab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.chipv{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line-strong)}.chipv.good{color:var(--good);border-color:var(--good);background:var(--good-bg)}.chipv.ok{color:var(--warn);border-color:var(--warn)}.chipv.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--s3);margin-top:var(--s3)}
.sug{display:flex;flex-direction:column;gap:4px;text-align:left;padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;font:inherit;color:inherit}.sug:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.sug .line i{font-style:normal;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-right:6px}.sfoot{display:flex;gap:var(--s3);align-items:center;margin-top:4px}.sfoot b{font-size:16px}
@media(max-width:900px){.tgrid,.tdeal,.tgains{grid-template-columns:1fr}.tdeal .arr{display:none}}
.tacards{display:grid;gap:var(--s2);margin-top:var(--s3)}
.tacard{position:relative;display:grid;grid-template-columns:1fr auto auto auto 24px;gap:var(--s3);align-items:center;padding:8px 10px 8px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.tacard .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc);border-radius:var(--r-sm) 0 0 var(--r-sm)}
.tacard .tn{display:flex;flex-direction:column;min-width:0}.tacard .tn b{font-size:14px}
.tacard .tv{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums;min-width:52px}.tacard .tv b{font-size:15px}
.tacard .x{border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1}.tacard .x:hover{color:var(--bad)}
@media(max-width:900px){.tacard{grid-template-columns:1fr auto auto 24px}.tacard .tsp{display:none}}
/* ===== responsive ===== */
@media(max-width:900px){
        .wrap{padding:var(--s4)}
  .lineups-grid{grid-template-columns:1fr}

  .gcards{grid-template-columns:1fr}
}
@media(max-width:600px){.fld{min-width:100%}}

/* ===== app shell (sidebar / context bar / tab bar) ===== */
:root{--side-w:232px;--rail-w:64px;--ctx-h:56px}
html{scroll-padding-top:calc(var(--ctx-h) + 12px)}
.skip{position:absolute;left:-999px;top:8px;background:var(--text);color:var(--bg);padding:8px 12px;border-radius:var(--r-sm);z-index:100}.skip:focus{left:8px}
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4) var(--s3);border-right:1px solid var(--line);background:var(--bg)}
.brand{font:700 21px/1 var(--serif);letter-spacing:-.2px;padding:6px var(--s3) 2px}
.searchbtn{display:flex;align-items:center;gap:var(--s2);width:100%;text-align:left;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 10px;color:var(--muted);cursor:pointer;min-height:36px}
.searchbtn span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:600 11px/1 var(--mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--muted);background:var(--surface)}
.sidenav{display:flex;flex-direction:column;gap:2px}
.ngrp{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);padding:var(--s3) var(--s3) 4px}
.nlink{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:var(--r-sm);padding:8px var(--s3);color:var(--muted);font-weight:600;cursor:pointer;text-align:left;min-height:36px}
.nlink svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nlink:hover{background:var(--ink-bg);color:var(--text)}
.nlink.on{background:var(--ink-bg);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:var(--s3)}
.col{min-width:0;display:flex;flex-direction:column}
.ctx{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);min-height:var(--ctx-h)}
.ctx-in{max-width:1320px;margin:0 auto;padding:var(--s2) var(--s5);display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;min-height:var(--ctx-h)}
.crumb{font:700 16px/1.2 var(--serif);margin-right:auto;white-space:nowrap}.crumb small{font:500 12.5px var(--font);color:var(--muted);margin-left:8px}
.gl{display:flex;align-items:center;gap:var(--s2);color:var(--muted);font-size:13px}
.gl select{width:auto;padding:6px var(--s3);min-height:34px}
.stamp{font-size:12px;color:var(--muted)}
.searchbtn svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}.searchbtn kbd{white-space:nowrap}
#tab-home,#tab-settings{display:flex;flex-direction:column;gap:var(--s4)}
.tabbar{display:none}
.rail-only{display:none}
@media(max-width:1100px){
  .app{grid-template-columns:var(--rail-w) minmax(0,1fr)}
  .side{padding:var(--s3) 6px;align-items:center}
  .brand{font-size:0}.brand:before{content:"G";font:700 22px var(--serif)}
  .searchbtn span,.searchbtn kbd,.ngrp,.nlink .nl{display:none}
  .searchbtn{width:44px;justify-content:center;padding:0;height:44px}
  .nlink{width:44px;height:44px;justify-content:center;padding:0}
  .ngrp{display:block;height:1px;padding:0;margin:6px 8px;background:var(--line);font-size:0}
}
@media(max-width:760px){
  .app{display:block}
  .side{display:none}
  .wrap{padding:var(--s4) var(--s4) 88px}
  .foot{padding-bottom:88px}
  .ctx-in{padding:var(--s2) var(--s4);gap:var(--s2)}
  .crumb{width:100%}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line-strong);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
  .tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button.on{color:var(--text);box-shadow:inset 0 3px 0 var(--accent)}
  .btn,.seg button,.pill,.subtabs button,select,.inp{min-height:44px}
  .btn.sm{min-height:40px}
}
/* ===== palette, toasts, skeleton, help ===== */
.pal-back{position:fixed;inset:0;background:rgba(20,18,14,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:12vh var(--s4) var(--s4)}
.pal{width:min(560px,100%);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:0 18px 50px rgba(0,0,0,.3);overflow:hidden;max-height:70vh;display:flex;flex-direction:column}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 16px;font-size:16px;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;overflow-y:auto}
.pal li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;min-height:40px}
.pal li[aria-selected="true"]{background:var(--ink-bg);box-shadow:inset 3px 0 0 var(--accent)}
.pal li small{margin-left:auto;color:var(--muted)}
.pal .ph{padding:8px 10px 2px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.toasts{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--text);color:var(--bg);border-radius:var(--r-sm);padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .18s ease-out}
.toast.err{background:var(--bad);color:#fff}.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:760px){.toasts{bottom:72px;right:12px;left:12px;max-width:none}}
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line-soft) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:var(--r-sm)}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--s3)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit}
button.tile{cursor:pointer}button.tile:hover{border-color:var(--line-strong)}
.tile .tl{font-size:12px;color:var(--muted);font-weight:600}.tile .tv{font:700 26px/1.2 var(--serif);font-variant-numeric:tabular-nums}.tile .ts{font-size:12.5px;color:var(--muted)}
.hgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:var(--s4)}@media(max-width:1100px){.hgrid{grid-template-columns:1fr}}
.rowlink{display:flex;align-items:center;gap:var(--s3);padding:10px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;background:none;border-width:0 0 1px;width:100%;text-align:left;font:inherit;color:inherit;min-height:44px}
.rowlink:last-child{border-bottom:0}.rowlink b{font-variant-numeric:tabular-nums}.rowlink .r{margin-left:auto;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.setgrid{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:10px 0;border-bottom:1px solid var(--line-soft)}.setrow:last-child{border-bottom:0}
.setrow .sd{color:var(--muted);font-size:12.5px;margin-top:2px}
.help dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}.help dt{white-space:nowrap}.help dd{margin:0;color:var(--muted)}
.tip{border-bottom:1px dotted var(--muted);cursor:help}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.card.empty b{font:700 17px var(--serif);color:var(--text);display:block;margin-bottom:4px}
.dense .card{padding:12px}.dense table.st td,.dense table.st th{padding-top:3px;padding-bottom:3px}

/* tables: sticky header + pinned columns, tooltips, toolbar */
.ttools{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);flex-wrap:wrap}.ttools .sp{flex:1}
.tscroll.tall{max-height:calc(100vh - var(--ctx-h) - 70px);overflow:auto;border:1px solid var(--line-soft);border-radius:var(--r-sm)}
.tscroll.tall thead th{position:sticky;top:0;z-index:3;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.tscroll.tall td.pin1,.tscroll.tall th.pin1{position:sticky;left:0;z-index:2;background:var(--surface);min-width:36px}
.tscroll.tall td.pin2,.tscroll.tall th.pin2{position:sticky;left:36px;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line-soft)}
.tscroll.tall thead th.pin1,.tscroll.tall thead th.pin2{z-index:4}
th.srt{cursor:pointer}th.srt:hover{color:var(--text)}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:100%;left:0;z-index:20;width:230px;white-space:normal;text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;line-height:1.4;background:var(--text);color:var(--bg);padding:7px 9px;border-radius:var(--r-sm);box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none}
.colmenu{position:relative}.colmenu summary{list-style:none;cursor:pointer}.colmenu summary::-webkit-details-marker{display:none}
.colpop{position:absolute;right:0;top:100%;z-index:25;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:10px 12px;display:grid;gap:6px;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.searchbtn kbd{margin-left:auto}
.colmenu summary{display:inline-flex;align-items:center;gap:6px;width:auto}.tscroll.tall td.pin2{min-width:200px;white-space:nowrap}.tscroll.tall td.pin2 .nm{white-space:nowrap}.tscroll.tall td.pin2 .p{white-space:nowrap}
@media(max-width:760px){.ctx{position:static}.ctx-in .btn.ghost,.ctx-in .stamp{display:none}.tscroll.tall{max-height:70vh}}
.pbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:320px;margin:12px auto 0}.pbar i{display:block;height:100%;width:2%;background:var(--accent);transition:width .25s linear}

<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
<aside class="side" id="side" aria-label="Primary"></aside>
<div class="col">
<header class="ctx"><div class="ctx-in">
  <div class="crumb" id="crumb">GridSim</div>
  <label class="gl">Week <select id="g_week" aria-label="Week"></select></label>
  <div class="seg" id="g_fmt" role="group" aria-label="Scoring"><button data-f="ppr" class="on">PPR</button><button data-f="half">Half</button><button data-f="std">Std</button></div>
  <label class="gl">Sims <select id="g_depth" aria-label="Simulations per game"><option value="fast">Fast (500)</option><option value="std" selected>Standard (1,000)</option><option value="deep">Deep (10,000)</option></select></label>
  <button class="btn primary sm" id="g_refresh" title="Re-run the simulations for this week">Run sims</button>
  <button class="btn ghost sm" id="g_update" title="Pull the latest injury reports, depth charts and results">Update data</button>
  <span class="stamp" id="g_stamp" aria-live="polite"></span>
</div></header>
<main class="wrap" id="main" tabindex="-1">
  <section id="pg-home" class="page hide"><div id="tab-home"></div></section>
  <section id="pg-settings" class="page hide"><div id="tab-settings"></div></section>

    <div class="card setup">
      <div class="setup-row">
        <div class="fld"><label class="f" for="away">Away</label><select id="away"></select></div>
        <button class="btn ghost sm swap" id="swap" title="Swap home and away">Swap</button>
        <div class="fld"><label class="f" for="home">Home</label><select id="home"></select></div>
        <div class="fld"><label class="f" for="condMode">Conditions</label><select id="condMode"><option value="auto">Auto: roof + forecast</option><option value="manual">Manual</option><option value="none">Ignore conditions</option></select></div>
        <label class="chk"><input type="checkbox" id="neutral"> Neutral site</label>
        <div class="actions"><button class="btn primary" id="runBtn">Simulate matchup</button><button class="btn ghost" id="gameBtn">Play one game</button></div>

<script>
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const fmt = (x, d = 1) => (x == null || x !== x) ? '–' : Number(x).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (x, d = 0) => x == null ? '–' : fmt(x * 100, d) + '%';
const sgn = (x, d = 1) => x == null ? '–' : (x > 0 ? '+' : x < 0 ? '−' : '') + fmt(Math.abs(x), d);
const st = {away: null, home: null, n: 2000, neutral: false, ov: {}, TEAMS: {}, lgRates: {}, league: {}, last: null, G: null, i: 0, timer: null,
  fmt: 'ppr', sched: null, week: null, slate: null, slateN: 500, pos: 'ALL', q: '', sort: {}, lab: {mine: [], opp: [], slotsK: false, slotsD: false, mineSet: null, oppSet: null}};
st.inj = {}; st.injDraft = {};
try { st.inj = JSON.parse(localStorage.getItem('gs_inj') || '{}'); st.injDraft = {...st.inj}; } catch (e) {}
try { st.lab.mine = JSON.parse(localStorage.getItem('gs_mine') || '[]'); st.lab.opp = JSON.parse(localStorage.getItem('gs_opp') || '[]'); } catch (e) {}
const C = {ink: '#1d1b17', muted: '#5f584c', rule: '#d8d0bf', rule2: '#b9ae96', good: '#2c6a3c', bad: '#a8372a', warn: '#8a5d08', bar: '#4a453c', neutral: '#7a7365'};
const _rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const _lum = c => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }; return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); };

const _hex = c => '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const _readable = {};
function readable(hex) {                       // darken a team color until it reads on the paper background
  if (_readable[hex]) return _readable[hex];

  while (_cr(c.map(v => v * k), paper) < 3.6 && k > .35) k -= .04;

}
const color = a => readable((st.TEAMS[a] || {color: '#7a7365'}).color);
function pairCols(a, h) {                       // two similar team colors in one chart become unreadable, so fall back to neutral
  const ca = color(a), ch = color(h), x = _rgb(ca), y = _rgb(ch);
  return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]) < 70 ? [C.neutral, ch] : [ca, ch];
}
const POSCOL = {QB: '#8f4524', RB: '#5d6b24', WR: '#2b5f8a', TE: '#8a6a1a', K: '#5f584c', DST: '#6e6657'};

async function init() {
  const [j, sc] = await Promise.all([fetch('/api/teams').then(r => r.json()), fetch('/api/schedule').then(r => r.json())]);
  st.TEAMS = j.teams; st.league = j.league; st.lgRates = j.league_rates; st.sched = sc; st.week = sc.next_week;
  $('#dataChip').textContent = `Data: 2026 weeks 1-${j.meta.max_week} plus 2025 prior. Injuries: ${j.meta.injuries}.`;
  const abbrs = Object.keys(st.TEAMS).sort((a, b) => st.TEAMS[a].name.localeCompare(st.TEAMS[b].name));
  for (const id of ['away', 'home']) { const s = $('#' + id); abbrs.forEach(a => s.add(new Option(st.TEAMS[a].name, a))); }
  const g0 = sc.games.find(g => g.week === sc.next_week && !g.played);
  st.home = g0 ? g0.home : (st.TEAMS.KC ? 'KC' : abbrs[0]); st.away = g0 ? g0.away : (st.TEAMS.BUF ? 'BUF' : abbrs[1]);
  if (g0 && g0.neutral) { st.neutral = true; $('#neutral').checked = true; }
  $('#home').value = st.home; $('#away').value = st.away;
  $('#home').onchange = e => { st.home = e.target.value; renderLineups(); };
  $('#away').onchange = e => { st.away = e.target.value; renderLineups(); };
  $('#neutral').onchange = e => st.neutral = e.target.checked;
  $('#condMode').onchange = e => { st.cond.mode = e.target.value; $('#condManual').classList.toggle('hide', st.cond.mode !== 'manual'); };
  $('#condRoof').onchange = e => st.cond.roof = e.target.value; $('#condWind').oninput = e => st.cond.wind = e.target.value; $('#condTemp').oninput = e => st.cond.temp = e.target.value;
  $('#runBtn').onclick = runSim; $('#gameBtn').onclick = playGame;
  $('#resetLineups').onclick = () => { st.ov = {}; renderLineups(); };
  buildShell();
  document.addEventListener('click', e => { const b = e.target.closest('.subtabs button'); if (b) setSub(b.parentElement.dataset.sg, b.dataset.k); });
  $('#swap').onclick = () => { [st.home, st.away] = [st.away, st.home]; $('#home').value = st.home; $('#away').value = st.away; renderLineups(); };
  $('#g_week').innerHTML = sc.weeks.map(w => `<option value="${w}" ${w === st.week ? 'selected' : ''}>Week ${w}</option>`).join('');
  $('#g_week').onchange = e => { st.week = +e.target.value; reloadSlate(); };
  $('#g_fmt').onclick = e => { const b = e.target.closest('button'); if (b) setFmt(b.dataset.f); };
  $('#g_depth').onchange = e => { st.depth = e.target.value; st.n = DEPTH[st.depth].n; reloadSlate(); };

    } catch (e) { $('#g_stamp').textContent = 'Update failed'; toast('Update failed: ' + e.message, {err: true, action: {label: 'Retry', fn: () => $('#g_update').click()}}); }
    busy($('#g_update'), false);
  };
  $('#dback').onclick = closeDrawer;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  renderLineups(); renderSlateShell(); renderNflShell();
  const empty = `<div class="card empty"><b>No simulation yet</b><span>Choose two teams above and press "Simulate matchup".</span></div>`;
  ['gl-ov', 'gl-fan', 'gl-mu'].forEach(id => $('#' + id).innerHTML = empty);
  applyRoute(true);
}
st.page = 'games'; st.sub = {lab: 'ov', players: 'rank', team: 'lineup'}; st.pg = {}; st.depth = 'std'; st.loading = false;
const DEPTH = {fast: {n: 1000, slate: 500, hint: ''}, std: {n: 2000, slate: 1000, hint: ''}, deep: {n: 10000, slate: 10000, hint: 'Deep runs take a minute or two for a full week.'}};
const PAGES = ['home', 'games', 'players', 'team', 'inj', 'lab', 'settings'];
function setSub(group, key, quiet) {
  st.sub[group] = key;
  document.querySelectorAll(`[data-sg="${group}"] button`).forEach(b => b.classList.toggle('on', b.dataset.k === key));
  document.querySelectorAll(`[data-sp="${group}"]`).forEach(p => p.classList.toggle('hide', p.dataset.k !== key));
  if (!quiet && typeof markNav === 'function') { markNav(); syncURL(true); }
}
function go(page, sub, o = {}) {
  const changed = st.page !== page; st.page = page;
  PAGES.forEach(p => $('#pg-' + p).classList.toggle('hide', p !== page));
  if (sub) setSub(page, sub, true);
  if (page === 'home') renderHome();
  if (page === 'settings') renderSettings();
  if (page === 'games') ensureSlate('games', renderNflWeek);
  if (page === 'players') ensureSlate('players', renderSlate);
  if (page === 'team') renderLeague();
  if (page === 'inj') ensureSlate('players', renderInjuries);
  if (page === 'home') ensureSlate('games', renderHome);
  if (changed) { window.scrollTo(0, 0); const m = $('#main'); if (m && !o.fromRoute) m.focus({preventScroll: true}); }
  markNav(); if (!o.noUrl) syncURL(changed);
}
const LEGACY = {proj: ['lab', 'ov'], game: ['lab', 'pbp'], nfl: ['games'], slate: ['players'], lab: ['team', 'sandbox'], league: ['team']};
function tab(t) { const [p, s] = LEGACY[t] || [t]; go(p, s); }
function ensureSlate(mode, after) { if (st.slate) { if (after) after(); return Promise.resolve(); } return loadSlate(mode); }
function rerender() { if (st.slate) { renderNflWeek(); renderSlate(); } if (st.page === 'team') renderLeague(); if (st.last) renderProj(st.last); }
function syncFmtUI() { document.querySelectorAll('#g_fmt button').forEach(b => b.classList.toggle('on', b.dataset.f === st.fmt)); }
function setFmt(f) { st.fmt = f; if (st.lab.trials) st.lab.trials.cache = {}; syncFmtUI(); rerender(); }
function reloadSlate() { st.ss.res = null; st.tr.px = null; st.tr.sugg = null; st.slate = null; st.wi.ros = null; st.wi.targets = null; if (st.lab.trials) st.lab.trials = null; const m = {home: 'games', games: 'games', players: 'players', team: 'team', inj: 'players', lab: null, settings: null}[st.page]; if (m) loadSlate(m); }

/* ---------- lineups sidebar ---------- */
function renderLineups() {
  const box = $('#lineups'); box.innerHTML = '';
  for (const a of [st.away, st.home]) {
    const T = st.TEAMS[a]; const d = el('div', 'lt');
    d.innerHTML = `<div class="lth"><span class="dot" style="background:${T.color}"></span>${T.name}<small>K ${T.kicker}</small></div>`;
    T.players.forEach(p => {
      const on = p.id in st.ov ? st.ov[p.id] : p.active;
      const r = el('div', 'pl' + (on ? '' : ' off'));
      const share = p.grp === 'QB' ? '' : [p.tgt >= .01 ? `${Math.round(p.tgt * 100)}%t` : '', p.car >= .02 ? `${Math.round(p.car * 100)}%c` : ''].filter(Boolean).join(' ');
      r.innerHTML = `<span class="ps">${p.pos}</span><span class="nm">${p.name}${badge(p.status, p.p_play, p.inj_note, p.idle)}</span><span class="sh">${share}</span><span class="sw"><input type="checkbox" ${on ? 'checked' : ''}><i></i></span>`;
      r.querySelector('input').onchange = e => { if (e.target.checked === p.active) delete st.ov[p.id]; else st.ov[p.id] = e.target.checked; r.classList.toggle('off', !e.target.checked); };
      d.appendChild(r);
    });
    box.appendChild(d);
  }
}
const rawM = g => g.blend ? g.blend.sim_home - g.blend.sim_away : g.sim_margin, rawT = g => g.blend ? g.blend.sim_home + g.blend.sim_away : g.sim_total;
const badge = (s, p, nt, idle) => idle === 'BYE' ? ' <em class="inj B" title="On bye this week">BYE</em>' : idle === 'INACTIVE' ? ' <em class="inj B" title="Not expected to play this week (backup or off the depth chart)">INACT</em>' : s ? ` <em class="inj ${s[0]}" title="${nt ? nt + '. ' : ''}${s}${p != null ? ': plays in ' + Math.round(p * 100) + '% of simulations (based on practice status)' : ''}">${s === 'Questionable' ? 'Q' + (p != null ? ' ' + Math.round(p * 100) + '%' : '') : s === 'Doubtful' ? 'D' : 'OUT'}</em>` : '';
st.cond = {mode: 'auto', roof: 'outdoors', wind: 0, temp: 60}; st.useWx = true;
function body() { return {home: st.home, away: st.away, n: st.n, neutral: st.neutral, overrides: st.ov, cond_mode: st.cond.mode, roof: st.cond.roof, wind: +st.cond.wind, temp: +st.cond.temp}; }
async function post(url, b, signal) {
  let r; try { r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b), signal}); }
  catch (e) { if (e.name === 'AbortError') throw e; throw new Error('Could not reach the GridSim server. Check that it is still running, then retry.'); }
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch (e) {} throw new Error(m); }
  return r.json();
}
function busy(btn, on, label) { btn.disabled = on; btn.dataset.l = btn.dataset.l || btn.textContent; btn.innerHTML = on ? `<span class="spin"></span>${label}` : btn.dataset.l; }
async function runSim() {
  $('#err').textContent = '';
  if (st.home === st.away) { $('#err').textContent = 'Pick two different teams.'; return; }
  busy($('#runBtn'), true, `Simulating ${st.n.toLocaleString()}…`);
  const t0 = performance.now();
  try { const d = await post('/api/simulate', body()); d.secs = (performance.now() - t0) / 1000; st.last = d; tab('proj'); renderProj(d); }
  catch (e) { $('#err').textContent = e.message; }
  busy($('#runBtn'), false);
}

/* ---------- fantasy-format helpers ---------- */
const FMTF = {ppr: 0, half: 0.5, std: 1};
const FMTN = {ppr: 'PPR', half: 'Half-PPR', std: 'Standard'};
const setCustomFmt = on => { if (on) { FMTN.custom = 'League'; FMTF.custom = 0; } else { delete FMTN.custom; delete FMTF.custom; } const g = document.querySelector('#g_fmt'); if (g) { g.querySelector('[data-f=custom]')?.remove(); if (on) { const b = document.createElement('button'); b.dataset.f = 'custom'; b.textContent = 'League'; b.onclick = () => setFmt('custom'); g.appendChild(b); } } };
const rdelta = r => {
  if (r.pos === 'K' || r.pos === 'DST') return 0;
  const sc = st.lg && st.lg.data.scoring, S = r.st || {};
  if (st.fmt === 'custom' && sc && sc.custom) return Object.keys(sc.base).reduce((a, k) => a + (sc.base[k] - (sc.coef[k] ?? sc.base[k])) * (S[k] || 0), 0);
  return FMTF[st.fmt] * (S.rec || 0);
};
const P = (r, k) => r[k] == null ? null : r[k] - rdelta(r);
function avgF(r) {
  if (r.avg == null) return null;
  if (!FMTF[st.fmt] || !r.trend) return r.avg;
  const rec = r.trend.reduce((a, w) => a + w[4], 0) / Math.max(r.trend.length, 1);
  return r.avg - FMTF[st.fmt] * rec;
}
function fmtToggle(id, after) {
  return `<div class="seg fseg" id="${id}">${Object.keys(FMTN).map(k => `<button data-f="${k}" class="${st.fmt === k ? 'on' : ''}">${FMTN[k]}</button>`).join('')}</div>`;
}
function bindFmt(id, after) { const b = $('#' + id); if (!b) return; b.onclick = e => { const x = e.target.closest('button'); if (!x) return; setFmt(x.dataset.f); if (after) after(); }; }

/* ---------- generic sortable table ---------- */
const TIPS = {proj: 'Simulator mean for this week, shrunk toward the field and blended with the season average.', range: 'Middle 80% of simulated outcomes (10th to 90th percentile). The tick is the projection.', med: 'Half of simulated games land above this, half below.', boom: 'Share of sims that reach a big week: 25+ QB, 20+ RB/WR, 15+ TE.', bust: 'Share of sims that flop: under 12 QB, 7 RB/WR, 4 TE.', sd: 'Standard deviation of simulated points: bigger means a wider range of outcomes.', opps: 'Expected touches plus targets (QBs: dropbacks).', td1: 'Chance of at least one touchdown.', vor: 'Value over replacement: points above the best freely available player at this position.', tier: 'Group of players with similar value; tiers break where projections drop off.', dlt: 'Projection minus the player\'s season average.'};
function csvDownload(name, cols, rows) {
  const q = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const cs = cols.filter(c => c.v); const out = [cs.map(c => q(c.t)).join(',')].concat(rows.map(r => cs.map(c => { const x = c.v(r); return q(typeof x === 'number' ? Math.round(x * 100) / 100 : x); }).join(',')));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out.join('\n')], {type: 'text/csv'})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function renderTable(host, id, cols, rows, opts = {}) {
  const hidKey = 'gs_cols_' + id; let hid = []; try { hid = JSON.parse(localStorage.getItem(hidKey) || '[]'); } catch (e) {}
  const allCols = cols; cols = cols.filter(c => !hid.includes(c.k) || c.first);
  const S = st.sort[id] || (st.sort[id] = {k: opts.sort || cols.find(c => c.v).k, dir: opts.dir || -1});
  const col = allCols.find(c => c.k === S.k) || cols[0];
  const sorted = [...rows].sort((a, b) => {
    const x = col.v(a), y = col.v(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * S.dir;

  const lim = pgN ? sorted.slice(0, pgN) : sorted;
  const pin = c => c.k === 'rk' ? ' pin1' : c.k === 'name' ? ' pin2' : '';
  const tools = opts.tools ? `<div class="ttools"><span class="sub2">Click a header to sort; hover a header for what it means</span><span class="sp"></span><details class="colmenu"><summary class="btn ghost sm">Columns</summary><div class="colpop">${allCols.filter(c => !c.first && c.v !== null).map(c => `<label class="chk"><input type="checkbox" data-col="${c.k}" ${hid.includes(c.k) ? '' : 'checked'}> ${c.t}</label>`).join('')}</div></details><button class="btn ghost sm" data-csv>Export CSV</button></div>` : '';
  host.innerHTML = tools + `<div class="tscroll${opts.tools ? ' tall' : ''}"><table class="st"><thead><tr>${cols.map(c => `<th data-k="${c.k}" ${c.v ? 'tabindex="0" aria-sort="' + (S.k === c.k ? (S.dir < 0 ? 'descending' : 'ascending') : 'none') + '"' : ''} ${TIPS[c.k] ? 'data-tip="' + TIPS[c.k].replace(/"/g, '&quot;') + '"' : ''} class="${c.v ? 'srt' : ''} ${S.k === c.k ? 'on' : ''} ${c.first ? 'l' : ''}${pin(c)}" style="${c.w ? 'width:' + c.w : ''}">${c.t}${S.k === c.k ? (S.dir < 0 ? ' ▾' : ' ▴') : ''}</th>`).join('')}</tr></thead><tbody>` +
    lim.map((r, i) => `<tr data-i="${i}" class="${opts.onRow ? 'clk' : ''}">${cols.map(c => `<td class="${c.cls || ''} ${c.first ? 'l' : ''}${pin(c)}">${c.h ? c.h(r, i) : fmt(c.v(r))}</td>`).join('')}</tr>`).join('') + `</tbody></table></div>` +
    (rows.length ? '' : `<div class="card empty" style="margin-top:8px"><b>No rows match</b><span>Try clearing the search or position filter.</span></div>`) +
    (pgN && rows.length > pgN ? `<div class="more"><span class="sub2">Showing ${lim.length} of ${rows.length}</span><button class="btn ghost sm" data-more>Show ${Math.min(step, rows.length - pgN)} more</button><button class="btn ghost sm" data-all>Show all</button></div>` : '');
  const mb = host.querySelector('[data-more]'); if (mb) mb.onclick = () => { st.pg[id] = pgN + step; renderTable(host, id, allCols, rows, opts); };
  const ab = host.querySelector('[data-all]'); if (ab) ab.onclick = () => { st.pg[id] = 0; renderTable(host, id, allCols, rows, opts); };
  const sortBy = th => { const k = th.dataset.k; if (S.k === k) S.dir *= -1; else { S.k = k; S.dir = (allCols.find(c => c.k === k).first ? 1 : -1); } renderTable(host, id, allCols, rows, opts); };
  host.querySelectorAll('th.srt').forEach(th => { th.onclick = () => sortBy(th); th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sortBy(th); } }; });
  host.querySelectorAll('[data-col]').forEach(cb => cb.onchange = () => { const h2 = new Set(hid); cb.checked ? h2.delete(cb.dataset.col) : h2.add(cb.dataset.col); try { localStorage.setItem(hidKey, JSON.stringify([...h2])); } catch (e) {} renderTable(host, id, allCols, rows, opts); const d = host.querySelector('.colmenu'); if (d) d.open = true; });
  const cv = host.querySelector('[data-csv]'); if (cv) cv.onclick = () => { csvDownload(`gridsim_${id}_week${st.week}.csv`, cols, sorted); toast(`Exported ${sorted.length} rows`); };
  if (opts.onRow) host.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => opts.onRow(lim[+tr.dataset.i]));
}

/* ---------- charts ---------- */
function hist(h, {lo, hi, w = 520, hgt = 150, colors, split = null, ticks = [], marks = []}) {
  const bins = h.counts.map((c, i) => ({c, x: h.lo + i * h.step}));
  const vis = bins.filter(b => b.x >= lo && b.x < hi);
  const max = Math.max(...vis.map(b => b.c), 1), tot = h.counts.reduce((a, c) => a + c, 0);
  const pad = {l: 8, r: 8, t: 12, b: 22}, iw = w - pad.l - pad.r, ih = hgt - pad.t - pad.b, bw = iw / vis.length;
  let s = `<svg viewBox="0 0 ${w} ${hgt}" width="100%">`;
  vis.forEach((b, i) => { const hh = b.c / max * ih;
    s += `<rect x="${pad.l + i * bw + .5}" y="${pad.t + ih - hh}" width="${Math.max(bw - 1, 1)}" height="${hh}" rx="1.5" fill="${colors(b.x)}" opacity=".85"><title>${b.x}${h.step > 1 ? '–' + (b.x + h.step - 1) : ''}: ${(b.c / tot * 100).toFixed(1)}%</title></rect>`; });
  ticks.forEach(t => { const x = pad.l + (t - lo) / (hi - lo) * iw;
    s += `<line x1="${x}" x2="${x}" y1="${pad.t}" y2="${pad.t + ih}" stroke="${t === split ? C.rule2 : C.rule}" ${t === split ? '' : 'stroke-dasharray="2 3"'}/><text x="${x}" y="${hgt - 6}" fill="${C.muted}" font-size="10.5" text-anchor="middle">${t}</text>`; });
  marks.forEach(m => { const x = pad.l + (m.x - lo) / (hi - lo) * iw;
    s += `<line x1="${x}" x2="${x}" y1="${pad.t - 4}" y2="${pad.t + ih}" stroke="${m.c}" stroke-width="2"/><text x="${x}" y="9" fill="${m.c}" font-size="10" text-anchor="middle" font-weight="700">${m.t}</text>`; });
  return s + '</svg>';
}
function rangeBar(lo, hi, mean, max, col, w = 110) {
  const sc = v => Math.max(0, Math.min(v / max, 1)) * (w - 6) + 3;
  return `<svg class="rng" width="${w}" height="14"><line x1="3" x2="${w - 3}" y1="7" y2="7" stroke="${C.rule}" stroke-width="2"/><rect x="${sc(lo)}" y="3" width="${Math.max(sc(hi) - sc(lo), 2)}" height="8" rx="3" fill="${col}" opacity=".35"/><line x1="${sc(mean)}" x2="${sc(mean)}" y1="1" y2="13" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/></svg>`;
}
function spark(vals, proj, col, w = 84, h = 22) {
  if (!vals || !vals.length) return '';
  const mx = Math.max(...vals, proj || 0, 1);
  const bw = w / vals.length;
  return `<svg width="${w}" height="${h}">` + vals.map((v, i) => `<rect x="${i * bw + 1}" y="${h - Math.max(v, 0) / mx * h}" width="${bw - 2}" height="${Math.max(v, 0) / mx * h}" rx="1" fill="${col}" opacity=".75"/>`).join('') +
    (proj != null ? `<line x1="0" x2="${w}" y1="${h - proj / mx * h}" y2="${h - proj / mx * h}" stroke="${C.ink}" stroke-opacity=".7" stroke-dasharray="2 2"/>` : '') + '</svg>';
}
const heat = v => v >= 0 ? `rgba(44,106,60,${Math.min(Math.abs(v) * 1.1, 1) * .55})` : `rgba(168,55,42,${Math.min(Math.abs(v) * 1.6, 1) * .55})`;

let ptab = 'Fantasy';
const card = (h, c = '') => { const d = el('div', 'card ' + c, h); return d; };

function renderProj(d) {

  const H = d.home, A = d.away, w = d.win, [ac, hc] = pairCols(A, H);

    <div class="mid"><div class="line">win probability</div>

      <div class="line">Median spread <b>${spread}</b> · Total <b>${fmt(d.total.median)}</b></div>

  <div class="note" style="text-align:center;margin-top:12px">${condLine(d.cond)}${d.n.toLocaleString()} simulated games in ${fmt(d.secs)}s · win % standard error ±${fmt(Math.sqrt(w.home * (1 - w.home) / d.n) * 100)} pts${st.neutral ? ' · neutral site' : ''}${Object.keys(st.ov).length ? ' · custom lineups' : ''}</div>`));

  OV.appendChild(g2);

  MU.appendChild(corrCard(d));

  const rows = TS_ROWS.map(([k, n]) => `<tr><td>${n}</td><td>${fmt(d.teamstats[A][k])} <span class="sub2">±${fmt(d.teamstats_sd[A][k])}</span></td><td>${fmt(d.teamstats[H][k])} <span class="sub2">±${fmt(d.teamstats_sd[H][k])}</span></td></tr>`).join('');

/* team-vs-team rating breakdown from the model's rates */
function matchupCard(d) {
  const L = st.lgRates, la = st.league, A = d.away, H = d.home, rA = st.TEAMS[A].rates, rH = st.TEAMS[H].rates;
  const exp = (o, df) => ({
    sack: la.sack_rate + (o.sack_off - la.sack_rate) + (df.sack_def - la.sack_rate),
    comp: df.cpoe_def, ypc: la.ypc + 0.8 * df.ypc_def + 0.5 * o.ypc_off, int: la.int_rate + (df.int_def - la.int_rate),
    pace: o.pace, pass: o.pass_shift });
  const a = exp(rA, rH), h = exp(rH, rA);
  const row = (name, key, f, good, note) => {
    const va = f(a[key]), vh = f(h[key]); const lgv = f(key === 'sack' ? la.sack_rate : key === 'ypc' ? la.ypc : key === 'int' ? la.int_rate : key === 'comp' ? 0 : key === 'pace' ? 1 : 0);
    const cl = v => Math.abs(v - lgv) < 0.0001 * Math.abs(lgv + 1) ? '' : ((v > lgv) === good ? 'pos' : 'neg');
    return `<tr><td>${name}<div class="sub2">${note}</div></td><td class="${cl(va)}">${va.toFixed(key === 'ypc' || key === 'pace' ? 2 : 1)}</td><td class="${cl(vh)}">${vh.toFixed(key === 'ypc' || key === 'pace' ? 2 : 1)}</td><td class="lgc">${lgv.toFixed(key === 'ypc' || key === 'pace' ? 2 : 1)}</td></tr>`; };
  return card(`<h3>Matchup breakdown <span class="sub2">· each team's offense against the opposing defense (green = favorable to the offense)</span></h3>
    <table class="st mb"><tr><th>Metric</th><th style="color:${color(A)}">${A} offense</th><th style="color:${color(H)}">${H} offense</th><th>League</th></tr>
    ${row('Sack rate faced (%)', 'sack', x => x * 100, false, 'their blocking + the other defense\'s pass rush')}
    ${row('Completion % over avg (opp D)', 'comp', x => x * 100, true, 'how much the opposing defense allows above league average')}
    ${row('Expected yards per carry', 'ypc', x => x, true, 'rushing ability vs run defense')}
    ${row('Interception rate (%)', 'int', x => x * 100, false, 'QB ball security + the defense\'s takeaways')}
    ${row('Pass-lean (logit shift)', 'pass', x => x, true, 'tendency to throw vs expected for the situation')}
    ${row('Pace (relative seconds/play)', 'pace', x => x, false, 'below 1.00 = faster than average')}</table>`);
}

/* player stat tables + fantasy table */
function renderPlayers(d) {
  const pl = $('#plCard'); const T = PTABS[ptab];
  const tabs = ['Fantasy', ...Object.keys(PTABS)];
  let h = `<h3>Player projections</h3><div class="tb">${tabs.map(k => `<button class="${k === ptab ? 'on' : ''}" data-t="${k}">${k}</button>`).join('')}</div><div id="ptab"></div>`;
  pl.innerHTML = h;
  pl.querySelectorAll('.tb button[data-t]').forEach(b => b.onclick = () => { ptab = b.dataset.t; renderPlayers(d); });
  const host = $('#ptab');
  if (ptab === 'Fantasy') { fantasyTable(host, 'mfant', d.rows, {note: true, limit: 12, step: 12}); return; }
  let out = '';
  for (const team of [d.away, d.home]) {
    const rows = (d.players[team] || []).filter(p => p[T.key]).sort((a, b) => b[T.key].mean - a[T.key].mean);
    const mainKey = (T.cols.find(c => c[2]) || T.cols[0])[0];
    const max = Math.max(...rows.map(p => p[mainKey] ? p[mainKey].p90 : 0), 1);
    out += `<table class="st" style="margin-bottom:14px"><tr><th style="color:${color(team)}">${team}</th>${T.cols.map(c => `<th>${c[1]}</th>`).join('')}<th style="width:120px">Range (10–90%)</th></tr>`;
    rows.forEach(p => {
      out += `<tr><td class="nm lnk" data-id="${p.id}">${p.name}<span class="p">${p.pos}</span></td>` + T.cols.map(([k,, m]) => {
        const v = p[k]; const dec = ['ptd', 'rtd', 'rectd', 'int', 'fl', 'xpa'].includes(k) ? 2 : 1; return `<td class="${m ? 'main' : ''}">${v ? fmt(v.mean, dec) : '–'}</td>`; }).join('') +
        `<td>${p[mainKey] ? rangeBar(p[mainKey].p10, p[mainKey].p90, p[mainKey].mean, max, C.bar) : ''}</td></tr>`;
    });
    out += '</table>';
  }
  host.innerHTML = out;
  host.querySelectorAll('.lnk').forEach(td => td.onclick = () => { const r = d.rows.find(x => x.id === td.dataset.id); if (r) showPlayer(r); });
}

    ...(o.rank ? [{k: 'rk', t: '#', v: r => r._rk, h: r => r._rk, w: '36px', first: 1}] : []),
    {k: 'name', t: 'Player', v: r => r.name, first: 1, h: r => `<span class="pdot" style="background:${POSCOL[r.pos] || C.muted}"></span><span class="nm lnk">${r.name}</span>${badge(r.status, r.p_play, r.inj_note, r.idle)}<span class="p">${r.pos} · ${r.team}</span>`},
    ...(o.slot ? [{k: 'slot', t: 'ESPN slot', v: r => r._slot, first: 1, h: r => `<span class="pill">${r._slot}</span>`}] : []),
    {k: 'pos', t: 'Pos', v: r => posOrder[r.pos], first: 1, h: r => `<span class="posb" style="color:${POSCOL[r.pos]}">${r.pos}${r._pr ? r._pr : ''}</span>`},
    ...(o.opp ? [{k: 'opp', t: 'Opp', v: r => r.opp, first: 1, h: r => `<span class="sub2">${r.home ? 'vs' : '@'}</span> ${r.opp}`}] : []),
    {k: 'proj', t: 'Proj', v: r => P(r, 'proj'), cls: 'main', h: r => fmt(P(r, 'proj'))},
    {k: 'range', t: 'Range (10–90%)', v: r => P(r, 'hi'), w: '130px', h: r => `<span class="rtxt">${fmt(P(r, 'lo'), 0)}–${fmt(P(r, 'hi'), 0)}</span>` + rangeBar(Math.max(P(r, 'lo'), 0), P(r, 'hi'), P(r, 'proj'), mx, C.bar, 90)},
    {k: 'med', t: 'Median', v: r => P(r, 'med'), h: r => fmt(P(r, 'med'))},
    {k: 'boom', t: 'Boom%', v: r => r.boom, h: r => r.boom == null ? '–' : `<span class="${r.boom >= .3 ? 'pos' : ''}">${pct(r.boom)}</span>`},
    {k: 'bust', t: 'Bust%', v: r => r.bust, h: r => r.bust == null ? '–' : `<span class="${r.bust >= .35 ? 'neg' : ''}">${pct(r.bust)}</span>`},
    {k: 'sd', t: 'SD', v: r => r.sd, h: r => fmt(r.sd)},
    {k: 'avg', t: 'Season avg', v: r => avgF(r), h: r => fmt(avgF(r))},
    {k: 'dlt', t: 'Proj vs avg', v: r => avgF(r) == null ? null : P(r, 'proj') - avgF(r), h: r => { const x = avgF(r) == null ? null : P(r, 'proj') - avgF(r); return x == null ? '–' : `<span class="${x > 1 ? 'pos' : x < -1 ? 'neg' : ''}">${sgn(x)}</span>`; }},
    {k: 'opps', t: 'Opps', v: r => r.opps, h: r => fmt(r.opps)},
    {k: 'td1', t: 'TD%', v: r => r.td1, h: r => r.pos === 'QB' || r.pos === 'K' || r.pos === 'DST' ? '–' : pct(r.td1)},
    {k: 'trend', t: 'Last wks', v: null, h: r => spark((r.trend || []).map(w => Array.isArray(w) ? w[1] : w), P(r, 'proj'), C.bar)},
    ...(o.vor ? [{k: 'vor', t: 'VOR', v: r => r._vor, h: r => `<span class="${r._vor > 0 ? 'pos' : 'neg'}">${sgn(r._vor)}</span>`}] : []),
    ...(o.tier ? [{k: 'tier', t: 'Tier', v: r => r._tier, first: 1, h: r => r._tier ? 'T' + r._tier : ''}] : []),
  ];
  renderTable(host, id, cols, rows, {sort: 'proj', limit: o.limit, step: o.step, tools: !!o.rank, onRow: r => showPlayer(r)});
  if (o.note) host.insertAdjacentHTML('beforeend', `<div class="note">Proj = simulator mean, shrunk toward the field and blended with the player's season average (fit on a walk-forward backtest); range widened to cover ~80% of outcomes. Boom = ≥25 QB / ≥20 RB·WR / ≥15 TE; Bust = &lt;12 / &lt;7 / &lt;4. Half-PPR and Standard shift each player's receptions out (approximate). Click any player for the full breakdown.</div>`);
}

/* correlation heat map + stack finder */
function corrCard(d) {
  const c = d.corr, n = c.ids.length;
  let t = `<table class="heat"><tr><th></th>${c.names.map((x, i) => `<th class="vh" style="color:${color(c.teams[i])}"><div>${x}</div></th>`).join('')}</tr>`;
  for (let i = 0; i < n; i++) t += `<tr><th style="color:${color(c.teams[i])}">${c.names[i]} <span class="sub2">${c.pos[i]}</span></th>${c.m[i].map((v, j) => `<td style="background:${i === j ? C.rule : heat(v)}" title="${c.names[i]} / ${c.names[j]}: ${v}">${i === j ? '' : v.toFixed(2).replace('0.', '.').replace('-0.', '−.')}</td>`).join('')}</tr>`;
  t += '</table>';
  const pairs = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) pairs.push({a: i, b: j, v: c.m[i][j], same: c.teams[i] === c.teams[j]});
  const li = p => `<tr><td>${c.names[p.a]} + ${c.names[p.b]}</td><td class="sub2">${p.same ? 'same team' : 'opposing'}</td><td class="${p.v > 0 ? 'pos' : 'neg'}">${p.v > 0 ? '+' : '−'}${Math.abs(p.v).toFixed(2)}</td></tr>`;
  const top = [...pairs].sort((x, y) => y.v - x.v).slice(0, 6), bot = [...pairs].sort((x, y) => x.v - y.v).slice(0, 4);
  return card(`<h3>Fantasy correlations <span class="sub2">· how players' scores move together across ${d.n.toLocaleString()} simulated games</span></h3>
    <div class="grid2c"><div class="tscroll">${t}</div><div><div class="sub2" style="margin-bottom:4px">BEST STACKS (move together)</div><table class="st">${top.map(li).join('')}</table>
    <div class="sub2" style="margin:12px 0 4px">ANTI-CORRELATED (one's gain is the other's loss)</div><table class="st">${bot.map(li).join('')}</table>
    <div class="note">Correlation near +1 means they boom or bust together (same-team QB + his top receiver, or a shootout). Useful for DFS stacking, and for deciding who to start in head-to-head leagues where you want variance (trailing) or safety (leading).</div></div></div>`);
}

/* game-script analysis */
function scriptCard(d) {
  const all = d.rows.filter(r => ['QB', 'RB', 'WR', 'TE'].includes(r.pos) && r.split && r.split.win != null).sort((a, b) => b.proj - a.proj);
  const rows = all.slice(0, st.pg.script || 8);
  const ratio = r => r.split.trail10 != null && r.split.lead10 != null && r.split.lead10 > 0 ? r.split.trail10 / r.split.lead10 : null;
  const med = {}; for (const t of [d.home, d.away]) { const v = rows.filter(r => r.team === t).map(ratio).filter(x => x != null).sort((a, b) => a - b); med[t] = v.length ? v[Math.floor(v.length / 2)] : 0.7; }

st.wi = {add: [], drop: [], ros: null, ctx: null, targets: null, q: ''};

function wiEval(ids, ctx) {
  const set = autoSet(ids), li = Object.values(set), A = lineupSum(li), pool = labPool();

}
const owner = (ctx, id) => ctx.owners ? (ctx.owners[id] || 'Free agent') : '';

    const nm = id => id ? `<span class="${same ? '' : 'strong'}">${wiName(id, pool)}</span> <span class="sub2">${pool[id] ? fmt(P(pool[id], 'proj')) : ''}</span>` : '<span class="sub2">empty</span>';

/* best single additions across everyone not on my team */
function wiTargets(ctx, base, B) {

  const byPos = {}; Object.values(pool).filter(p => want.has(p.pos) && !base.includes(p.id) && p.status !== 'Out').forEach(p => (byPos[p.pos] = byPos[p.pos] || []).push(p));
  const cands = Object.values(byPos).flatMap(a => a.sort((x, y) => y.proj - x.proj).slice(0, 14));
  st.wi.targets = cands.map(p => { const ids = [...base, p.id], s = autoSet(ids), li = Object.values(s); return {p, gain: sumP(li) - B.ev, owner: owner(ctx, p.id)}; }).filter(x => x.gain > .05).sort((a, b) => b.gain - a.gain).slice(0, 20);

/* rest-of-season: the same comparison summed over every remaining week */
async function loadRos(ctx) {
  const W = st.wi, last = Math.max(...st.sched.weeks), weeks = []; for (let w = st.slate.week; w <= last; w++) weeks.push(w);
  W.ros = {weeks, pools: {}, any: {}, idx: {}, loading: true, done: 0};
  const add = (w, rows) => { W.ros.pools[w] = Object.fromEntries(rows.map(r => [r.id, r])); rows.forEach(r => { if (!W.ros.any[r.id]) W.ros.any[r.id] = r; const k = r.team + '|' + r.pos; (W.ros.idx[k] = W.ros.idx[k] || []); if (!W.ros.idx[k].some(x => x.id === r.id)) W.ros.idx[k].push(r); }); };
  add(st.slate.week, [...(st.slate.rows_idle || []), ...st.slate.rows]); W.ros.done = 1; renderWhatIf(ctx);
  try {
    for (const w of weeks.slice(1)) { const d = await post('/api/slate', {week: w, n: Math.min(DEPTH[st.depth].slate, 1000), weather: false, ov: st.inj}); add(w, [...(d.rows_idle || []), ...d.rows]); W.ros.done++; renderWhatIf(ctx); }
  } catch (e) { W.ros.error = e.message; }
  W.ros.loading = false; renderWhatIf(ctx);
}

  if (R.loading) { out.appendChild(card(`<h3>Rest of season</h3><div class="empty" style="padding:var(--s4)"><span class="spin dark"></span><span>Simulating week ${st.slate.week + R.done - 1} of ${R.weeks[R.weeks.length - 1]}</span></div>`)); return; }
  const rows = R.weeks.map(w => { const pw = R.pools[w], ig = w !== st.slate.week;
    const b = sumPIn(pw, Object.values(autoSet(base, pw, ig))), a = sumPIn(pw, Object.values(autoSet(after, pw, ig)));
    return {w, b, a, d: a - b, byes: after.filter(i => !pw[i] || pw[i].idle === 'BYE').map(i => wiName(i, labPool()))}; });
  const tb = rows.reduce((s, r) => s + r.b, 0), ta = rows.reduce((s, r) => s + r.a, 0), td = ta - tb, changed = st.wi.add.length || st.wi.drop.length;
  const mx = Math.max(...rows.map(r => Math.abs(r.d)), 1), bw = 1000 / rows.length;

    `<line x1="0" x2="1000" y1="70" y2="70" stroke="${C.rule2}"/></svg>`;
  out.appendChild(card(`<h3>Rest of season <span class="sub2">weeks ${R.weeks[0]} to ${R.weeks[R.weeks.length - 1]}, best lineup each week</span></h3>
    ${changed ? `<div class="verdict ${td > .5 ? 'up' : td < -.5 ? 'down' : ''}"><b>${td > .5 ? 'Better over the season' : td < -.5 ? 'Worse over the season' : 'About the same over the season'}</b><span>${sgn(td)} total points (${sgn(td / rows.length)} per week) · ${fmt(tb)} before, ${fmt(ta)} after</span></div>` : `<div class="note" style="margin-top:0">Add or remove players to see the season-long effect. Totals below are your current roster.</div>`}
    ${svg}<div class="tscroll"><table class="st"><tr><th class="l">Week</th><th>Before</th><th>After</th><th>Change</th><th class="l">After changes, on bye</th></tr>
      ${rows.map(r => `<tr><td class="l">${r.w}</td><td>${fmt(r.b)}</td><td>${fmt(r.a)}</td><td class="${Math.abs(r.d) < .05 ? '' : r.d > 0 ? 'pos' : 'neg'}">${changed ? sgn(r.d) : ''}</td><td class="l sub2">${r.byes.join(', ')}</td></tr>`).join('')}

// "josh allen", "allen", "j.allen" or a team code all match the abbreviated names in the data ("J.Allen")
function nameMatch(p, s) {
  const n = p.name.toLowerCase(), t = s.split(/\s+/).filter(Boolean);
  if (n.includes(s) || p.team.toLowerCase() === s) return true;
  if (t.length < 2) return false;
  const last = t.slice(1).join(' '), nl = n.replace(/^[a-z]{1,3}\./, '');
  return nl.startsWith(last) && n[0] === t[0][0];
}
st.ta = {give: [], get: [], mode: 'ros', loading: null, heal: true, base: 'starter', teams: 12, bench: 6};
const TA_POS = ['QB', 'RB', 'WR', 'TE'], TA_ALL = ['QB', 'RB', 'WR', 'TE', 'K', 'DST'];
function taWeeks() {
  const S = st.slate, R = st.wi.ros && !st.wi.ros.loading && !st.wi.ros.error ? st.wi.ros : null, mode = st.ta.mode;
  const po = ((st.lg && st.lg.data.settings && st.lg.data.settings.regular_weeks) || 14) + 1;
  if (mode === 'week' || !R) return [{w: S.week, pool: labPool(), wt: 1}];

}
// League shape: from the loaded ESPN league, else the settings in the analyzer (default 12 teams, 6 bench, QB/2RB/2WR/TE/FLEX)
function taLeague() {
  const L = st.lg && st.lg.data, c = st.lab.counts;
  return {teams: L ? L.teams.length : st.ta.teams, bench: L ? (L.bench ?? st.ta.bench) : st.ta.bench, from: L ? 'your league' : 'settings',
          QB: c.QB || 0, RB: c.RB || 0, WR: c.WR || 0, TE: c.TE || 0, FLEX: c.FLEX || 0, OP: c.OP || 0, K: c.K || 1, DST: c.DST || 1};
}
// Fill every team's lineup (and, for roster value, its bench) with the best projected players, then the baseline at each
// position is the best player left over. Flex and superflex spots go to whichever eligible players project highest.
function taRepl(W) {
  const lg = taLeague(), out = {}, info = {};
  W.forEach(x => {
    const by = {}; TA_ALL.forEach(p => by[p] = []);
    Object.values(x.pool).forEach(r => { if (!r.idle && by[r.pos]) by[r.pos].push(P(r, 'proj')); });
    TA_ALL.forEach(p => by[p].sort((a, b) => b - a));
    const used = {}, next = p => by[p][used[p]] ?? 0;
    TA_ALL.forEach(p => { used[p] = Math.min(lg[p] * lg.teams, by[p].length); });
    const fill = (n, elig, key = next) => { for (let i = 0; i < n; i++) { const p = elig.filter(q => used[q] < by[q].length).sort((a, b) => key(b) - key(a))[0]; if (!p) break; used[p]++; } };
    fill(lg.FLEX * lg.teams, ['RB', 'WR', 'TE']); fill(lg.OP * lg.teams, ['QB', 'RB', 'WR', 'TE']);
    const starter = Object.fromEntries(TA_ALL.map(p => [p, next(p)]));
    if (st.ta.base === 'roster') {
      // bench spots go where the drop-off below a starter is smallest (best value over the starter baseline)
      fill(lg.bench * lg.teams, TA_POS, p => next(p) - starter[p]);
    }
    out[x.w] = Object.fromEntries(TA_ALL.map(p => [p, next(p)]));
    info[x.w] = Object.fromEntries(TA_ALL.map(p => [p, used[p] + 1]));
    out[x.w]._starter = starter;

}
function taPlayer(id, W, RP) {

  const heal = st.ta.heal, w0 = st.slate.week;
  const wk = W.map(x => { const r = x.pool[id]; let pj = r && !r.idle ? P(r, 'proj') : 0;
    if (heal && x.w > w0 && r && r.idle && r.idle !== 'BYE' && any.avg != null) pj = Math.max(0, avgF(any) ?? any.avg);  /* injured: back at his season average */ return {w: x.w, pj, bye: !r || r.idle === 'BYE', out: r && r.idle && r.idle !== 'BYE', vor: Math.max(0, pj - ((RP.val[x.w] || {})[any.pos] ?? pj)), wt: x.wt}; });

}

}

function fieldX(g) {          // ball x for every log entry; fill gaps (kickoffs, etc.)

  return xs;
}
