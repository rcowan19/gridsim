/* ---- Accounts: sign-in (Supabase), plans (Stripe). With auth off (local use) none of this appears. ---- */
let SB = null;
const GBRAND = `<div class="brand"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM4 12h16M12 4v16"/></svg></i>GridSim</div>`;
function gateShow(html) { const g = $('#gate'); g.innerHTML = html; g.classList.remove('hide'); document.querySelector('.app').inert = true; const f = g.querySelector('input,button'); if (f) f.focus(); }
function gateHide() { const g = $('#gate'); g.classList.add('hide'); g.innerHTML = ''; document.querySelector('.app').inert = false; st.gating = false; }
async function loadSB(cfg) {
  if (!window.supabase) await new Promise((ok, no) => { const el = document.createElement('script'); el.src = '/static/vendor/supabase.js'; el.onload = ok; el.onerror = () => no(new Error('Could not load the sign-in library.')); document.head.appendChild(el); });
  SB = window.supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  SB.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') showNewPassword(); else if (ev === 'SIGNED_OUT' && !st.gating) showAuth(); });
}
async function accessToken() { const {data} = await SB.auth.getSession(); return data && data.session ? data.session.access_token : null; }
function installAuthFetch() {
  const f0 = window.fetch.bind(window);
  window.fetch = async (u, o = {}) => {
    const url = typeof u === 'string' ? u : u.url;
    if (!url.startsWith('/api/') || url.startsWith('/api/config') || url.startsWith('/api/billing/prices')) return f0(u, o);
    const t = await accessToken(), h = new Headers(o.headers || {}); if (t) h.set('Authorization', 'Bearer ' + t);
    const r = await f0(u, {...o, headers: h});
    if (!st.gating) { if (r.status === 401) showAuth('Your session ended. Sign in again.'); else if (r.status === 402) showPaywall(); }
    return r;
  };
}
function showAuth(msg, mode = 'in') {
  st.gating = true; const up = mode === 'up';
  gateShow(`<div class="gbox">${GBRAND}<div class="card"><h1 id="gTitle">${up ? 'Create your account' : 'Sign in'}</h1><p class="lead">${up ? 'One account for your leagues and your plan.' : 'Welcome back.'}</p>
    ${st.cfg && st.cfg.google ? '<button class="btn lg" id="gGoogle" type="button">Continue with Google</button><div class="gor"><span>or</span></div>' : ''}
    <form id="gForm" class="gform" novalidate><div><label class="f" for="gEmail">Email</label><input class="inp" id="gEmail" type="email" autocomplete="email" required></div>
      <div><label class="f" for="gPw">Password</label><input class="inp" id="gPw" type="password" autocomplete="${up ? 'new-password' : 'current-password'}" required><div class="sub2" style="margin-top:4px">${up ? 'At least 8 characters.' : ''}</div></div>
      <button class="btn primary lg" id="gSubmit" type="submit">${up ? 'Create account' : 'Sign in'}</button></form>
    <div class="err" id="gErr" role="alert" style="display:${msg ? 'block' : 'none'}">${esc(msg || '')}</div>
    <div class="gline">${up ? 'Already have an account? <button class="lnk" id="gSwap" type="button">Sign in</button>' : 'New here? <button class="lnk" id="gSwap" type="button">Create an account</button> · <button class="lnk" id="gForgot" type="button">Forgot password</button>'}</div></div>
    <div class="gfoot">By continuing you agree to the <a href="/static/legal/terms.html" target="_blank" rel="noopener">Terms</a> and <a href="/static/legal/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</div></div>`);
  const err = m => { const e = $('#gErr'); e.textContent = m; e.style.display = m ? 'block' : 'none'; };
  $('#gSwap').onclick = () => showAuth('', up ? 'in' : 'up');
  const fg = $('#gForgot'); if (fg) fg.onclick = async () => {
    const email = $('#gEmail').value.trim(); if (!email) { err('Enter your email first, then press Forgot password.'); return; }
    const {error} = await SB.auth.resetPasswordForEmail(email, {redirectTo: location.origin + '/'}); err(error ? error.message : ''); if (!error) toast('If that email has an account, a reset link is on its way.');
  };
  const gg = $('#gGoogle'); if (gg) gg.onclick = async () => { const {error} = await SB.auth.signInWithOAuth({provider: 'google', options: {redirectTo: location.origin + '/'}}); if (error) err(error.message); };
  $('#gForm').onsubmit = async e => {
    e.preventDefault(); const email = $('#gEmail').value.trim(), password = $('#gPw').value; err('');
    if (!email || !password) { err('Enter your email and password.'); return; }
    if (up && password.length < 8) { err('Use at least 8 characters for your password.'); return; }
    busy($('#gSubmit'), true, up ? 'Creating' : 'Signing in');
    const r = up ? await SB.auth.signUp({email, password, options: {emailRedirectTo: location.origin + '/'}}) : await SB.auth.signInWithPassword({email, password});
    busy($('#gSubmit'), false);
    if (r.error) { err(r.error.message); return; }
    if (up && !r.data.session) { err(''); toast('Check your email to confirm your account, then sign in.', {ms: 9000}); showAuth('Check your email to confirm your account, then sign in here.', 'in'); return; }
    boot();
  };
}
function showNewPassword() {
  st.gating = true;
  gateShow(`<div class="gbox">${GBRAND}<div class="card"><h1 id="gTitle">Set a new password</h1><form id="gForm" class="gform" novalidate><div><label class="f" for="gPw">New password</label><input class="inp" id="gPw" type="password" autocomplete="new-password"></div>
    <button class="btn primary lg" id="gSubmit" type="submit">Save password</button></form><div class="err" id="gErr" role="alert" style="display:none"></div></div></div>`);
  $('#gForm').onsubmit = async e => { e.preventDefault(); const pw = $('#gPw').value; if (pw.length < 8) { $('#gErr').textContent = 'Use at least 8 characters.'; $('#gErr').style.display = 'block'; return; }
    const {error} = await SB.auth.updateUser({password: pw}); if (error) { $('#gErr').textContent = error.message; $('#gErr').style.display = 'block'; return; } toast('Password updated.'); boot(); };
}
async function showPaywall(note) {
  st.gating = true;
  const pr = await fetch('/api/billing/prices').then(r => r.json()).catch(() => ({})), lab = k => pr[k] ? pr[k].label : '', trial = (st.cfg && st.cfg.trial_days) || 0;
  const me = st.me || {}, email = (me.user || {}).email || '';
  gateShow(`<div class="gbox wide">${GBRAND}<div class="card"><h1 id="gTitle">Choose a plan</h1><p class="lead">${esc(note || 'Lineup advice, waiver and trade ideas, and game simulations for your fantasy leagues.')}</p>
    <div class="plans"><div class="plan"><b>Monthly</b><div class="pr">${lab('monthly')}<small>${lab('monthly') ? 'per month' : ''}</small></div><ul><li>Everything in GridSim</li><li>Cancel any time</li>${trial ? `<li>${trial}-day free trial</li>` : ''}</ul><button class="btn lg" data-plan="monthly">${trial ? 'Start free trial' : 'Subscribe monthly'}</button></div>
      <div class="plan best"><b>Season pass</b><div class="pr">${lab('season')}<small>${lab('season') ? 'one payment' : ''}</small></div><ul><li>Everything in GridSim</li><li>Covers the whole NFL season, playoffs included</li><li>No renewal</li></ul><button class="btn primary lg" data-plan="season">Get the season pass</button></div></div>
    <div class="err" id="gErr" role="alert" style="display:none"></div>
    <div class="gline">${email ? `Signed in as ${esc(email)} · ` : ''}<button class="lnk" id="gOut" type="button">Sign out</button>${me.plan && me.plan.customer ? ' · <button class="lnk" id="gPortal" type="button">Manage billing</button>' : ''}${me.leagues ? ' · <button class="lnk" id="gBack" type="button">Back</button>' : ''}</div></div>
    <div class="gfoot">Payments are handled securely by Stripe. By subscribing you agree to the <a href="/static/legal/terms.html" target="_blank" rel="noopener">Terms</a>.</div></div>`);
  const err = m => { const e = $('#gErr'); e.textContent = m; e.style.display = 'block'; };
  $('#gate').querySelectorAll('[data-plan]').forEach(b => b.onclick = async () => {
    busy(b, true, 'Opening checkout');
    try { const r = await fetch('/api/billing/checkout', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({plan: b.dataset.plan})}); const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); location.href = d.url; }
    catch (e) { err(e.message); busy(b, false); }
  });
  $('#gOut').onclick = signOut; const gp = $('#gPortal'); if (gp) gp.onclick = openPortal;
  const gb = $('#gBack'); if (gb) gb.onclick = () => { if (st.me && st.me.plan && st.me.plan.active) gateHide(); else gb.remove(); };
}
async function openPortal() {
  try { const r = await fetch('/api/billing/portal', {method: 'POST'}); const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); location.href = d.url; }
  catch (e) { toast('Could not open billing: ' + e.message, {err: true}); }
}
async function signOut() { st.gating = true; try { await SB.auth.signOut(); } catch (e) {} location.href = '/'; }
async function getMe() { const r = await fetch('/api/me'); if (!r.ok) return null; return r.json(); }
async function boot() {
  st.cfg = await fetch('/api/config').then(r => r.json()).catch(() => ({auth: false}));
  if (st.cfg.auth) {
    try { if (!SB) { await loadSB(st.cfg); installAuthFetch(); } } catch (e) { gateShow(`<div class="gbox"><div class="card"><h1 id="gTitle">Sign-in unavailable</h1><p class="lead">${esc(e.message)} Reload the page to try again.</p></div></div>`); return; }
    if (!(await accessToken())) { showAuth(); return; }
    st.gating = false;
    const q = new URLSearchParams(location.search), paid = q.get('billing') === 'success';
    let me = await getMe(); if (!me) { showAuth(); return; }
    if (paid && !me.plan.active) {        // the webhook can land a moment after the redirect
      gateShow(`<div class="gbox">${GBRAND}<div class="card"><h1 id="gTitle">Activating your plan</h1><p class="lead">Payment received. This takes a few seconds.</p><div class="pbar"><i id="loadBar"></i></div></div></div>`);
      for (let i = 0; i < 20 && !me.plan.active; i++) { await new Promise(r => setTimeout(r, 1500)); me = (await getMe()) || me; }
    }
    if (q.has('billing')) history.replaceState(null, '', location.pathname);
    st.me = me;
    if (!me.plan.active) { showPaywall(q.get('billing') === 'cancel' ? 'No charge was made. Pick a plan whenever you are ready.' : null); return; }
    gateHide();
  } else { st.me = (await getMe()) || {user: {}, plan: {active: true}, leagues: []}; }
  if (!st.booted) { st.booted = true; init(); }
  else { st.slate = null; autoConnect(); go(st.page || 'home'); }
}

/* horizontally scrolling tables must be reachable by keyboard */
new MutationObserver(() => document.querySelectorAll('.tscroll:not([tabindex])').forEach(e => e.setAttribute('tabindex', '0'))).observe(document.body, {childList: true, subtree: true});
boot();
