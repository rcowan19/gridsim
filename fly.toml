# Fly.io config. Edit `app`, then:  fly launch --no-deploy --copy-config   (answer "yes" to keep this file)
#   fly volumes create gridsim_data --size 3 --region ord
#   fly secrets set SUPABASE_URL=... SUPABASE_ANON_KEY=... SUPABASE_JWT_SECRET=... DATABASE_URL=... GRIDSIM_SECRET_KEY=... \
#       STRIPE_SECRET_KEY=... STRIPE_WEBHOOK_SECRET=... STRIPE_PRICE_MONTHLY=... STRIPE_PRICE_SEASON=... GRIDSIM_ADMIN_EMAILS=you@example.com
#   fly deploy
app = "gridsim-app"
primary_region = "ord"

[env]
  APP_URL = "https://gridsim-app.fly.dev"      # your real domain once it is attached
  GRIDSIM_REFRESH_HOURS = "6"
  PORT = "8000"

[mounts]
  source = "gridsim_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"                    # the simulator keeps workers warm; stopping would make every first visit slow
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  grace_period = "10m"                          # first boot builds the model
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  size = "performance-2x"                       # the simulator is CPU-bound; start here and watch the load
  memory = "4gb"
